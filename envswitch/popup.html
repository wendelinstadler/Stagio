<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Stagio</title>
<style>
  :root { --bg:#fff; --fg:#1c1c1e; --muted:#6b6b70; --line:#e2e2e6; --accent:#1a73e8; --soft:#f1f3f6; --bad:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1f2023; --fg:#f2f2f3; --muted:#a5a5ab; --line:#3a3b40; --accent:#8ab4f8; --soft:#2a2b2f; --bad:#ff8a80; }
  }
  * { box-sizing:border-box; }
  body { margin:0; width:380px; padding:12px; display:grid; grid-template-columns:minmax(0,1fr); gap:12px; background:var(--bg); color:var(--fg); font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
  h1 { margin:0; font-size:13px; font-weight:600; color:var(--muted); }
  .envs { display:grid; gap:6px; }
  .env { display:flex; align-items:center; gap:8px; width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); font:inherit; text-align:left; cursor:pointer; }
  .env:hover { background:var(--soft); }
  .env[aria-current="true"] { border-color:var(--accent); background:var(--soft); cursor:default; }
  .dot { width:10px; height:10px; border-radius:50%; flex:none; }
  .env b { flex:none; }
  .env span.o { color:var(--muted); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .muted { color:var(--muted); font-size:12px; }
  .bad { color:var(--bad); font-size:12px; }
  #list { display:grid; gap:8px; }
  .proj { border:1px solid var(--line); border-radius:8px; padding:8px 10px; display:grid; grid-template-columns:minmax(0,1fr); gap:6px; }
  .head { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .head b { overflow-wrap:anywhere; }
  .pages { display:flex; flex-wrap:wrap; align-items:center; gap:4px 6px; }
  .pages .who { display:flex; align-items:center; gap:6px; min-width:58px; font-weight:600; }
  .chip { padding:2px 9px; border:1px solid var(--line); border-radius:999px; background:var(--bg); color:var(--fg); font:inherit; font-size:12px; cursor:pointer; }
  .chip:hover { background:var(--soft); }
  .chip.all { margin-left:auto; border-color:var(--accent); color:var(--accent); font-weight:600; }
  form { display:grid; grid-template-columns:minmax(0,1fr); gap:6px; padding:10px; background:var(--soft); border-radius:8px; }
  input, textarea { width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); font:inherit; }
  textarea { font-family:ui-monospace,Consolas,monospace; font-size:12px; resize:vertical; }
  label.f { display:grid; gap:2px; font-size:12px; color:var(--muted); }
  .row { display:flex; gap:8px; justify-content:flex-end; align-items:center; }
  button.btn { padding:6px 10px; border:0; border-radius:6px; background:var(--accent); color:var(--bg); font:inherit; font-weight:600; cursor:pointer; }
  button.link { border:0; background:none; color:var(--muted); font:inherit; font-size:12px; cursor:pointer; padding:0 0 0 8px; }
  button.link:hover { color:var(--fg); }
  button.link.open { color:var(--accent); font-weight:600; }
  [data-armed] { border-color:var(--bad) !important; color:var(--bad) !important; font-weight:600; }
  .note { display:flex; gap:8px; justify-content:space-between; align-items:baseline; }
  footer a { color:var(--muted); }
  footer a:hover { color:var(--accent); }
  .foot { display:flex; justify-content:center; gap:8px; }
  .nudge { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:8px; background:color-mix(in srgb, #ffdd00 22%, var(--bg)); font-size:12px; }
  .nudge a { color:var(--fg); font-weight:600; }
  .nudge button { margin-left:auto; border:0; background:none; color:var(--muted); font-size:15px; cursor:pointer; }
  button.plain { padding:0; margin-top:6px; color:var(--accent); }
  /* Schnell-Requests */
  #quick:empty { display:none; }
  #quick { display:grid; gap:6px; }
  .qhead { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .qhead h1 { flex:1; min-width:0; }
  .qenv { display:flex; align-items:center; gap:4px; padding:1px 8px; border:1px solid var(--line); border-radius:999px; background:var(--bg); color:var(--fg); font:inherit; font-size:11px; cursor:pointer; }
  .qenv[aria-pressed="true"] { border-color:var(--accent); background:var(--soft); font-weight:600; }
  .qenv .dot { width:8px; height:8px; }
  .q { border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .qrow { display:flex; align-items:center; gap:8px; width:100%; padding:6px 8px; border:0; background:var(--bg); color:var(--fg); font:inherit; text-align:left; cursor:pointer; }
  .qrow:hover { background:var(--soft); }
  .qm { flex:none; min-width:50px; padding:2px 0; border-radius:4px; color:#fff; font-size:11px; font-weight:700; text-align:center; background:#61affe; }
  .qm.POST { background:#49cc90; } .qm.PUT { background:#fca130; } .qm.PATCH { background:#50e3c2; } .qm.DELETE { background:#f93e3e; } .qm.HEAD { background:#9012fe; } .qm.OPTIONS { background:#0d5aa7; }
  .qp { min-width:0; display:grid; }
  .qp code { font-family:ui-monospace,Consolas,monospace; font-size:12px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .qp span { color:var(--muted); font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .qgo { margin-left:auto; flex:none; color:var(--accent); font-weight:600; font-size:12px; }
  .qrow[data-armed] .qgo, .qrow[data-armed] { color:var(--bad); }
  .qres { display:grid; gap:4px; padding:6px 8px 8px; border-top:1px solid var(--line); background:var(--soft); }
  .qmeta { display:flex; align-items:center; gap:8px; font-size:12px; }
  .qmeta .grow { flex:1; }
  .st { padding:1px 6px; border-radius:4px; color:#fff; font:700 11px ui-monospace,Consolas,monospace; }
  .s2 { background:#188038; } .s3 { background:#1a73e8; } .s4 { background:#b06000; } .s5 { background:#c5221f; }
  .qout { margin:0; max-height:200px; overflow:auto; padding:6px 8px; border-radius:6px; background:#1e1f22; color:#e8e8ea; font:11px/1.45 ui-monospace,Consolas,monospace; white-space:pre-wrap; overflow-wrap:anywhere; }
  .warn { color:#b06000; font-size:11px; }
  /* Kopfzeile mit Tabs (weitere Bereiche wie Logs einfach in TABS in popup.js ergänzen) */
  [hidden] { display:none !important; }
  .bar { position:sticky; top:-12px; z-index:2; display:flex; align-items:center; gap:10px; margin:-12px -12px 0; padding:8px 12px; border-bottom:1px solid var(--line); background:var(--bg); }
  .brand { display:flex; align-items:center; gap:6px; font-weight:700; white-space:nowrap; }
  .brand img { width:20px; height:20px; }
  .tabs { display:flex; gap:1px; padding:2px; border-radius:8px; background:var(--soft); margin-right:auto; }
  .tab { display:flex; align-items:center; gap:4px; padding:4px 8px; border:0; border-radius:6px; background:none; color:var(--muted); font:inherit; font-size:12px; font-weight:600; cursor:pointer; }
  .tab:hover { color:var(--fg); }
  .tab[aria-selected="true"] { background:var(--bg); color:var(--fg); box-shadow:0 1px 2px rgba(0,0,0,.12); }
  .tab .n { min-width:16px; padding:0 4px; border-radius:999px; background:var(--accent); color:var(--bg); font-size:10px; line-height:16px; text-align:center; }
  button.icon { width:26px; height:26px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--muted); font:inherit; font-size:14px; cursor:pointer; }
  button.icon:hover { color:var(--accent); border-color:var(--accent); }
  .view { display:grid; grid-template-columns:minmax(0,1fr); gap:12px; }
  .btn.wide { width:100%; padding:8px; }
  .empty { padding:14px 10px; border:1px dashed var(--line); border-radius:8px; text-align:center; }
  .addf { display:grid; grid-template-columns:minmax(0,1fr); gap:6px; padding:10px; background:var(--soft); border-radius:8px; }
  .addrow { display:flex; gap:6px; }
  .addrow select { flex:none; width:auto; font-weight:700; font-family:ui-monospace,Consolas,monospace; font-size:12px; }
  .addrow input { flex:1; min-width:0; font-family:ui-monospace,Consolas,monospace; font-size:12px; }
  select { padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); font:inherit; }
  #addInfo:empty, #addErr:empty { display:none; }
  /* Branch Manager */
  #vcsBox { display:grid; gap:10px; }
  .vgroup { display:grid; gap:6px; }
  .rc { border:1px solid var(--line); border-radius:8px; padding:8px 10px; display:grid; gap:6px; }
  .rhead { display:flex; align-items:center; gap:6px; }
  .rhead b { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .vcs { padding:0 5px; border-radius:4px; color:#fff; font-size:10px; font-weight:700; text-transform:uppercase; }
  .vcs.git { background:#f05033; } .vcs.hg { background:#8a8a8a; }
  .br { display:flex; align-items:center; gap:6px; font-family:ui-monospace,Consolas,monospace; font-size:12px; overflow-wrap:anywhere; }
  .br b { font-weight:700; }
  .stat { display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; font-size:12px; }
  .pill2 { padding:0 7px; border-radius:999px; background:var(--soft); font-size:11px; }
  .pill2.warn2 { background:color-mix(in srgb, #b06000 18%, var(--bg)); color:#b06000; }
  .pill2.up { background:color-mix(in srgb, var(--accent) 16%, var(--bg)); color:var(--accent); }
  .acts { display:flex; flex-wrap:wrap; gap:4px; }
  .mini { padding:2px 9px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); font:inherit; font-size:12px; cursor:pointer; }
  .mini:hover { background:var(--soft); }
  .mini.on { border-color:var(--accent); color:var(--accent); font-weight:600; }
  .mini:disabled { opacity:.5; cursor:default; }
  .blist { display:grid; max-height:180px; overflow:auto; border:1px solid var(--line); border-radius:6px; }
  .bitem { display:flex; align-items:center; gap:6px; width:100%; padding:5px 8px; border:0; border-bottom:1px solid var(--line); background:var(--bg); color:var(--fg); font:12px ui-monospace,Consolas,monospace; text-align:left; cursor:pointer; }
  .bitem:last-child { border-bottom:0; }
  .bitem:hover { background:var(--soft); }
  .bitem.cur { color:var(--accent); font-weight:700; cursor:default; }
  .bitem .t { margin-left:auto; color:var(--muted); font:11px system-ui,sans-serif; white-space:nowrap; }
  .bitem[data-armed] { color:var(--bad); }
  .newb { display:grid; gap:4px; padding:8px; border-radius:6px; background:var(--soft); }
  .newb .two { display:grid; grid-template-columns:110px minmax(0,1fr); gap:4px; }
  .newb input { font-size:12px; padding:5px 7px; }
  .commits { display:grid; gap:3px; font-size:12px; }
  .commit { display:grid; grid-template-columns:auto minmax(0,1fr); gap:0 8px; }
  .commit code { color:var(--muted); font-size:11px; }
  .commit span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .commit small { grid-column:2; color:var(--muted); font-size:11px; }
  .busy { color:var(--muted); font-size:12px; }
  .rerr { color:var(--bad); font-size:12px; white-space:pre-wrap; overflow-wrap:anywhere; max-height:120px; overflow:auto; }
  .rmsg { color:var(--muted); font-size:12px; white-space:pre-wrap; max-height:80px; overflow:auto; }
  /* Server-Status */
  .hdot { width:7px; height:7px; border-radius:50%; flex:none; background:var(--line); box-shadow:0 0 0 2px var(--bg); margin-left:4px; display:inline-block; vertical-align:middle; }
  .env .hdot { margin-left:auto; }
  .hdot[data-state="up"] { background:#1e8e3e; }
  .hdot[data-state="warn"] { background:#e37400; }
  .hdot[data-state="error"], .hdot[data-state="down"] { background:#d93025; }
  .hdot[data-state="wait"] { animation:pulse 1s infinite alternate; }
  @keyframes pulse { to { opacity:.35; } }
  .envnames { display:flex; flex-wrap:wrap; gap:4px 12px; }
  /* Header-Preset, Werkzeuge */
  .hline { display:flex; align-items:center; gap:6px; margin-top:8px; font-size:12px; }
  .hline .o { color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .hbadge { flex:none; padding:0 7px; border-radius:999px; background:var(--soft); color:var(--muted); font-size:11px; font-weight:600; }
  .hbadge.on { background:color-mix(in srgb, #1e8e3e 16%, var(--bg)); color:#1e8e3e; }
  .tools { display:flex; gap:6px; margin-top:8px; }
  .cpanel { display:grid; gap:6px; margin-top:8px; padding:10px; border-radius:8px; background:var(--soft); }
  .copt { display:flex; gap:8px; align-items:flex-start; font-size:12px; }
  .copt small { display:block; color:var(--muted); font-size:11px; }
  /* Logs */
  #logBox { display:grid; gap:8px; }
  .lhead { display:flex; flex-wrap:wrap; gap:4px; align-items:center; }
  .logs { display:grid; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .log { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:8px; padding:6px 8px; border-bottom:1px solid var(--line); font-size:12px; }
  .log:last-child { border-bottom:0; }
  .lk { padding:0 5px; border-radius:4px; font-size:10px; font-weight:700; color:#fff; background:#d93025; align-self:start; margin-top:1px; }
  .k-console .lk { background:#e37400; } .k-net .lk { background:#5f6368; }
  .lm { min-width:0; overflow-wrap:anywhere; }
  .lm small { display:block; color:var(--muted); font:11px ui-monospace,Consolas,monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ln { color:var(--muted); font-weight:600; }
  .lt { color:var(--muted); font-size:11px; white-space:nowrap; }
  /* Aufnahme */
  .recbtn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:7px; border:1px dashed var(--line); border-radius:8px; background:var(--bg); color:var(--fg); font:inherit; font-size:12px; cursor:pointer; }
  .recbtn:hover { border-color:#d93025; color:#d93025; }
  .rdot { width:9px; height:9px; border-radius:50%; background:#d93025; flex:none; }
  .rdot.live { animation:pulse .7s infinite alternate; }
  .recrun { display:flex; align-items:center; gap:8px; padding:8px 10px; border:1px solid #d93025; border-radius:8px; font-size:12px; font-weight:600; }
  .recdone { display:grid; gap:6px; padding:10px; border-radius:8px; background:var(--soft); }
  .rlist { display:grid; max-height:200px; overflow:auto; border:1px solid var(--line); border-radius:6px; background:var(--bg); }
  .ritem { display:flex; align-items:center; gap:6px; padding:4px 8px; border-bottom:1px solid var(--line); font-size:12px; cursor:pointer; }
  .ritem:last-child { border-bottom:0; }
  .ritem code { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:ui-monospace,Consolas,monospace; font-size:11px; }
  .ritem .qm { min-width:44px; font-size:10px; }
  .teambar { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 8px; border-radius:6px; background:color-mix(in srgb, var(--accent) 12%, var(--bg)); font-size:12px; }
</style>
</head>
<body>
<header class="bar">
  <span class="brand" title="Stagio"><img src="icons/48.png" alt="Stagio"></span>
  <nav id="tabs" class="tabs" role="tablist"></nav>
  <button class="icon" id="api" title="API-Tester im grossen Fenster öffnen">↗</button>
</header>

<div class="view" data-view="switch">
<section id="now"></section>
<section id="list"></section>
<form id="form">
  <h1 id="formTitle">Projekt hinzufügen</h1>
  <input id="name" placeholder="Projektname" required>
  <label class="f">Umgebungen (Name = Adresse, Name frei wählbar)
    <textarea id="envs" rows="3" required placeholder="Lokal = http://localhost:3000&#10;Test = test.example.ch&#10;Prod 2 = https://www.example.ch"></textarea>
  </label>
  <div><button type="button" class="link plain" id="addCurrent" style="margin-top:0" hidden>Aktuelle Seite als Zeile einfügen</button></div>
  <label class="f">Seiten (optional, Name = Pfad)
    <textarea id="pages" rows="3" placeholder="Shop = /&#10;Backoffice = /backoffice&#10;Admin = /admin"></textarea>
  </label>
  <div class="muted">Weicht eine Seite in einer Umgebung ab, eine Zeile mit @ ergänzen: <code>Backoffice @ Prod = /anderer-pfad</code></div>
  <div class="muted">Tastenkürzel: Alt+Shift+E schaltet die Umgebung weiter, Alt+Shift+1 bis 3 springt direkt. Auf Live geht es nur per Klick.</div>
  <div class="bad" id="err"></div>
  <div class="row">
    <button type="button" class="link" id="cancel" hidden>Abbrechen</button>
    <button class="btn" id="submit">Speichern</button>
  </div>
</form>
<label class="muted" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="marker" style="width:auto"> Umgebung auf der Seite markieren (Farbbalken und Tab-Titel)</label>
</div>

<div class="view" data-view="api" hidden>
<section id="recBox"></section>
<section id="quick"></section>
<form id="addForm" class="addf" hidden>
  <h1>Request hinzufügen</h1>
  <select id="addProject" title="Projekt"></select>
  <div class="addrow">
    <select id="addMethod" title="Methode"><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option></select>
    <input id="addPath" placeholder="/api/users, Adresse oder cURL einfügen" spellcheck="false" autocomplete="off">
  </div>
  <input id="addName" placeholder="Name (optional), z. B. Alle Benutzer">
  <textarea id="addBody" rows="4" spellcheck="false" placeholder='Body (optional), z. B. {"name": "Anna"}' hidden></textarea>
  <div class="muted" id="addInfo"></div>
  <div class="bad" id="addErr"></div>
  <div class="row">
    <button type="button" class="link" id="addCancel">Abbrechen</button>
    <button class="btn" id="addSave">Speichern</button>
  </div>
</form>
<button class="btn wide" id="addBtn">+ Request hinzufügen</button>
<button class="link plain" id="importLink" style="justify-self:center;margin:0">Mehrere importieren (cURL, Postman, HAR, OpenAPI) ↗</button>
</div>

<div class="view" data-view="git" hidden>
<section id="vcsBox"></section>
<button class="link plain" id="vcsSettings" style="justify-self:center;margin:0">Branch Manager einrichten</button>
</div>

<div class="view" data-view="logs" hidden>
<section id="logBox"></section>
</div>

<div id="nudge"></div>
<footer class="muted foot"><a id="siteLink" target="_blank" rel="noopener noreferrer">stagio.dev</a><span>·</span><a id="supportLink" target="_blank" rel="noopener noreferrer">Stagio unterstützen</a></footer>
<script src="i18n.js"></script>
<script src="common.js"></script>
<script src="popup.js"></script>
</body>
</html>
